{% extends "base.html" %}{% load static %}{% block title %}{{ item.title }}{% endblock %}{% block content %}<section class="wrap section">
<a class="text-link" href="{% url 'menu' %}">Back to menu</a>
<div class="detail-grid">
  <img src="{% if item.image %}{% static item.image %}{% else %}{% static 'images/salad.svg' %}{% endif %}"
       width="640"
       height="427"
       alt="Illustration of {{ item.title }}">
  <div>
    <p class="intro">{{ item.category.title }}</p>
    <h1>{{ item.title }}</h1>
    <p class="detail-price">${{ item.price }}</p>
    <p>{{ item.description }}</p>
    <p>Please ask about ingredients and allergies before ordering.</p>
    <a class="button" href="{% url 'book' %}">Book a table</a>
  </div>
</div>
</section>
{% endblock %}
