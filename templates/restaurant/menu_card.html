{% load static %}
<article class="menu-card">
  <a class="menu-image"
     href="{% url 'menu-detail' item.id %}"
     tabindex="-1"
     aria-hidden="true">
    <img src="{% if item.image %}{% static item.image %}{% else %}{% static 'images/salad.svg' %}{% endif %}"
         width="480"
         height="320"
         loading="lazy"
         alt="">
  </a>
  <div class="menu-card-heading">
    <h3>
      <a href="{% url 'menu-detail' item.id %}">{{ item.title }}</a>
    </h3>
    <span class="price">${{ item.price }}</span>
  </div>
  <p>{{ item.description|truncatewords:28 }}</p>{% if item.category %}<span class="category">{{ item.category.title }}</span>{% endif %}</article>
